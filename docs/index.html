<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TKT — Discord Support</title>
<style>
:root{color-scheme:dark;background:#150d22;color:#f7eeff;font:16px/1.6 system-ui,sans-serif;--ink:#f7eeff;--muted:#c9b6dc;--purple:#c998ff;--line:#49345c}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1120px,calc(100% - 38px));margin:auto}header,footer{border-bottom:1px solid var(--line)}header>div{display:flex;min-height:69px;align-items:center;justify-content:space-between}.logo{font-size:25px;letter-spacing:-.085em;font-weight:900;color:var(--purple)}select,.button{font:inherit;background:#2c1c42;color:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 12px}a{color:var(--purple)}.hero{background:radial-gradient(ellipse at 76% 30%,#362053,transparent 60%);padding:75px 0}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center}h1,h2,h3,p{margin:0}h1{font-size:clamp(49px,7.2vw,91px);line-height:.97;letter-spacing:-.075em;margin:14px 0 21px}h1 span{color:var(--purple)}h2{font-size:clamp(29px,4vw,46px);letter-spacing:-.05em;margin-bottom:18px}.tag{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:850;color:var(--purple)}.lede,.muted{color:var(--muted)}.lede{font-size:20px;max-width:480px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.button{display:inline-block;font-weight:750;text-decoration:none}.primary{background:var(--purple);color:#201133}.preview,article{background:#211630;border:1px solid var(--line);border-radius:15px;padding:20px}.preview{box-shadow:0 24px 75px #0d0816}.preview h2{font-size:23px;margin-bottom:10px}.sample{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:13px 0;gap:10px}.sample span+span{color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article p{color:var(--muted);margin-top:5px}section.features{padding:48px 0}footer{border-top:1px solid var(--line);border-bottom:0;padding:18px 0;color:var(--muted)}@media(max-width:750px){.layout,.grid{grid-template-columns:1fr}.hero{padding:45px 0}}
</style></head>
<body>
<header><div class="wrap"><strong class="logo">TKT</strong><select id="locale" aria-label="Idioma / Language"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option></select></div></header>
<main><section class="hero"><div class="wrap layout"><div><p class="tag" data-k="tag"></p><h1><span data-k="lead"></span><br><span data-k="tail"></span></h1><p class="lede" data-k="intro"></p><div class="actions"><a class="button primary" href="dashboard.html" data-k="demo"></a><a class="button" href="https://github.com/seijiftr/tkt" data-k="code"></a></div></div>
<div class="preview"><p class="tag" data-k="sample"></p><h2 data-k="queue"></h2><div class="sample"><span data-k="general"></span><span data-k="open"></span></div><div class="sample"><span data-k="billing"></span><span data-k="active"></span></div><div class="sample"><span data-k="bugs"></span><span data-k="closed"></span></div></div></div></section>
<section class="wrap features"><h2 data-k="features"></h2><div class="grid"><article><h3 data-k="panels"></h3><p data-k="panelsText"></p></article><article><h3 data-k="private"></h3><p data-k="privateText"></p></article><article><h3 data-k="analytics"></h3><p data-k="analyticsText"></p></article></div></section></main>
<footer><div class="wrap" data-k="footer"></div></footer>
<script>
const copy={
'pt-BR':{tag:'Bot de suporte para Discord',lead:'Atendimento',tail:'em um só lugar.',intro:'Publique painéis no Discord, acompanhe a fila e veja quanto tempo sua equipe leva para atender.',demo:'Explorar dashboard',code:'Ver código no GitHub',sample:'Demonstração',queue:'Fila de tickets',general:'# suporte-geral',open:'Aberto',billing:'# financeiro',active:'Em atendimento',bugs:'# reportar-bug',closed:'Encerrado',features:'Da abertura ao acompanhamento',panels:'Painéis de abertura',panelsText:'Configure a mensagem de cada painel e publique no canal desejado pelo dashboard.',private:'Atendimento privado',privateText:'Organize a fila, abra o canal no Discord e preserve a conversa em uma transcrição.',analytics:'Métricas de atendimento',analyticsText:'Veja o volume diário e compare a mediana e o P90 dos tempos de atribuição e primeira resposta.',footer:'TKT · Suporte para comunidades no Discord'},
en:{tag:'Discord support bot',lead:'Your support desk',tail:'in one place.',intro:'Publish panels to Discord, track the queue and see how long your team takes to respond.',demo:'Explore dashboard',code:'View source on GitHub',sample:'Demo',queue:'Ticket queue',general:'# general-help',open:'Open',billing:'# billing',active:'In progress',bugs:'# bug-report',closed:'Closed',features:'From opening to follow-up',panels:'Ticket panels',panelsText:'Configure each panel message and publish it to a Discord channel from the dashboard.',private:'Private support',privateText:'Organize the queue, open the Discord channel and preserve the conversation in a transcript.',analytics:'Support metrics',analyticsText:'See daily volume and compare median and P90 times for claiming and first response.',footer:'TKT · Support for Discord communities'}
};
const field=document.getElementById('locale');
function translate(locale){document.documentElement.lang=locale;field.value=locale;for(const item of document.querySelectorAll('[data-k]'))item.textContent=copy[locale][item.dataset.k]}
field.onchange=()=>{localStorage.setItem('tkt-language',field.value);translate(field.value)};
translate(localStorage.getItem('tkt-language')==='en'?'en':'pt-BR');
</script>
</body></html>
